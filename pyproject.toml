[project]
name = "kestreleye-vision"
version = "0.1.0"
description = "Offline drone image analysis for vineyard disease detection"
requires-python = ">=3.11"

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"